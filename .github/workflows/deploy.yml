name: Build (auto) + Deploy to Cloud Provider (manual)

on:
  push:
    branches: ["**"]

  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (latest | sha-<commit> | branch-<branch>)"
        required: false
        default: "latest"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CONTAINER_NAME: inmo24x7-api
  CLOUD_ENV_FILE: inmo24x7-api/.env

jobs:
  build:
    name: Build & Push to GHCR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Compute branch tag
        id: vars
        run: |
          BRANCH="${GITHUB_REF_NAME//\//-}"
          APP_VERSION="$(node -p "require('./package.json').version")"
          APP_BUILD_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          echo "branch_tag=branch-${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "app_commit_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "app_build_date=${APP_BUILD_DATE}" >> "$GITHUB_OUTPUT"

      # Required to build ARM64 images from GitHub's AMD64 runner
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true

          # Oracle Ampere = ARM64
          # Keep AMD64 so the image also works on DigitalOcean / x86
          platforms: linux/amd64,linux/arm64

          build-args: |
            APP_VERSION=${{ steps.vars.outputs.app_version }}
            APP_COMMIT_SHA=${{ steps.vars.outputs.app_commit_sha }}
            APP_BUILD_DATE=${{ steps.vars.outputs.app_build_date }}

          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.branch_tag }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Cloud (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: prod

    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USERNAME }}
          key: ${{ secrets.CLOUD_SSH_KEY }}

          script: |
            set -euo pipefail

            TAG="${{ inputs.tag }}"
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"

            echo "Deploying ${IMAGE}"

            ENV_FILE="$HOME/${{ env.CLOUD_ENV_FILE }}"

            if [ ! -f "$ENV_FILE" ]; then
              echo "ERROR: Environment file does not exist: $ENV_FILE"
              echo "Create it with PORT, OPENAI_API_KEY, OPENAI_MODEL, PROPERTY_LOADER, SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY"
              exit 1
            fi

            set -a
            . "$ENV_FILE"
            set +a

            PORT="${PORT:-3000}"

            echo "${{ secrets.GHCR_PAT }}" | \
              docker login ghcr.io \
              -u "${{ github.repository_owner }}" \
              --password-stdin

            if ! docker manifest inspect "${IMAGE}" >/dev/null 2>&1; then
              echo "ERROR: Image/tag does not exist in GHCR: ${IMAGE}"
              exit 1
            fi

            docker pull "${IMAGE}"

            mkdir -p "$HOME/inmo24x7-api/data"

            docker stop "${{ env.CONTAINER_NAME }}" || true
            docker rm "${{ env.CONTAINER_NAME }}" || true

            docker run -d \
              --name "${{ env.CONTAINER_NAME }}" \
              --restart unless-stopped \
              -p "127.0.0.1:${PORT}:${PORT}" \
              --env-file "$ENV_FILE" \
              -v "$HOME/inmo24x7-api/data:/app/data" \
              "${IMAGE}" \
              node --experimental-specifier-resolution=node dist/index.js

            docker image prune -f

            docker ps --filter "name=${{ env.CONTAINER_NAME }}"